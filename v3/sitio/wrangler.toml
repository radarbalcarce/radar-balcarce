# El sitio de Radar 3.0 (ver REGLAS.md). Lo sube el workflow «Radar 3.0: desplegar» (opción sitio).
name = "radar-sitio"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
# El respaldo al sitio viejo (ORIGEN_VIEJO, en radar-balcarce.pages.dev) es un pedido a otro sitio de Cloudflare: sin esta bandera, desde workers.dev da error 1019
# (lo mismo que pasó con el archivo, infra/archivo-cloudflare/wrangler.toml, 23/10).
compatibility_flags = ["global_fetch_strictly_public"]

# La misma base que el núcleo. El workflow la busca por nombre y reemplaza el marcador.
[[d1_databases]]
binding = "DB"
database_name = "radar-nucleo"
database_id = "REEMPLAZADO_POR_EL_WORKFLOW"

# Las fotos de las notas viejas (/fotos-notas/*) y las tipografías (/fuentes/*): se copian con scripts/copiar-fotos.mjs. El workflow crea el depósito si no existe.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "radar-fotos"

[vars]
# "si" desde el corte (radarbalcarce.com apunta a este Worker): se indexa, con canonical https://radarbalcarce.com. Con "no": noindex en todo y robots.txt cerrado.
INDEXAR = "si"
# Cloudflare Web Analytics (sin cookies): el token público del sitio de Web Analytics que ya existe en la cuenta. Vacío = sin medición.
CF_BEACON = "63fea16828ce46988d62382b0fbabf60"
# AdSense y Google Analytics, APAGADOS. Con valor aparece el aviso de cookies, el script (sólo si el lector acepta) y /ads.txt. Formatos: ca-pub-1234567890123456 y G-XXXXXXXXXX.
ADSENSE_CLIENTE = ""
GA_ID = ""
# Los bloques de AdSense (números de bloque que da el panel de AdSense al crear cada unidad): dentro de la nota y al final de las secciones.
ADSENSE_SLOT_NOTA = ""
ADSENSE_SLOT_SECCION = ""
# El sitio viejo, que sigue publicándose: lo que este sitio no maneja (panel, farmacias, clima, íconos…) y las notas que no están en la base se piden ahí. Nunca radarbalcarce.com (bucle). Vacío = sin respaldo.
ORIGEN_VIEJO = "https://radar-balcarce.pages.dev"
