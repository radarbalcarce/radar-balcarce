# Las redes de Radar 3.0 (ver worker.mjs, redes.mjs y REGLAS.md). Lo sube el workflow «Radar 3.0: desplegar» (opción redes).
name = "radar-redes"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
# Cada 15 minutos de 8:00 a 21:45 de Balcarce (11:00 a 00:45 UTC) y a las 22:00 (01:00 UTC): elegir.mjs corta lo que cae fuera de 8:00 a 22:00.
# El resumen del día por Telegram a las 22:05 (01:05 UTC).
# Desde el 10/11/2026 (disparar-acciones.mjs) otros dos despiertan workflows de GitHub Actions, a la misma hora que tenían sus `schedule:` (GitHub dejó de lanzarlos ese día):
#   "7 10-23,0-2 * * *"                  «Radar 3.0: piezas de redes», una vez por hora de 7:07 a 23:07 de Balcarce.
#   "40 9,11,13,15,17,19,21,23,1 * * *"  «Radar 3.0: fotos propias», cada 2 horas a los :40 de 6:40 a 22:40 de Balcarce.
# Una prueba controla que estas expresiones y las de disparar-acciones.mjs sean las mismas. Ninguna cae en los minutos 0, 15, 30, 45, 5 ni en el cron del resumen.
crons = ["*/15 0,11-23 * * *", "0 1 * * *", "5 1 * * *", "7 10-23,0-2 * * *", "40 9,11,13,15,17,19,21,23,1 * * *"]

# La misma base D1 del núcleo y del sitio: lee las notas publicadas y anota en `publicaciones`. El workflow la crea si no existe y reemplaza el marcador.
[[d1_databases]]
binding = "DB"
database_name = "radar-nucleo"
database_id = "REEMPLAZADO_POR_EL_WORKFLOW"

# Enlace directo al bot (un Worker no puede llamar a otro de la misma cuenta por workers.dev).
[[services]]
binding = "TELEGRAM"
service = "radar-telegram"

# Las placas de los posteos (las dibuja el workflow «Radar 3.0: piezas de redes» y las sube acá; el Worker las sirve en /placa/<nombre> y Meta las baja).
[[r2_buckets]]
binding = "PLACAS"
bucket_name = "radar-render"

[vars]
# «no» frena SÓLO los posteos de notas (Facebook + espejo de Instagram); los reels y las historias siguen.
POSTEOS_ACTIVOS = "si"
# «si»: el posteo sale con la placa de la marca (foto arriba, rótulo, título, bajada), nunca con la foto sola; una nota sin placa dibujada espera.
POSTEOS_CON_PLACA = "si"
# «no» = simula (elige, arma el texto, lo anota con simulado = 1 y no llama a Meta). «si» = publica de verdad. La prende una persona.
REDES_ACTIVAS = "si"
# El espejo de cada posteo de Facebook en el feed de Instagram (foto entera, sin enlace). «no» lo apaga.
INSTAGRAM_ESPEJO = "si"
# Opcional: el cupo de audios del día para las piezas de video (por defecto 10, el de la clave gratis).
VOZ_TOPE_DIARIO = "15"
# Cuántos YouTube Shorts por día como máximo (Hernán, 5/11: sale todo y se mide una semana). Es el valor de siempre del código; se cambia acá.
TOPE_YOUTUBE_POR_DIA = "12"
# «si»: el posteo de X por Buffer lleva el enlace a la nota (en X con enlace llega unas 13 veces menos). Apagado por defecto.
X_CON_ENLACE = "no"
SITIO = "https://radarbalcarce.com"

# Secretos META_TOKEN y TELEGRAM_TOKEN: los carga el workflow desde GitHub Secrets. Nunca acá.
# PAGINA_DE_FACEBOOK (opcional): si no está, se usa la página «Radar Balcarce» (1254237411116171).
PAGINA_DE_FACEBOOK = "1254237411116171"
