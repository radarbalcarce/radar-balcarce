# El núcleo de Radar 3.0 (ver worker.mjs, nucleo.mjs y REGLAS.md). Lo sube el workflow «Radar 3.0: desplegar» (opción nucleo).
name = "radar-nucleo"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# fotos.mjs usa Buffer para pasar las imágenes a base64.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# Cada 15 minutos la vuelta (leer, agrupar, elegir, redactar); a las 00:30 UTC (21:30 de Balcarce) el resumen del día por Telegram.
crons = ["*/15 * * * *", "30 0 * * *"]

# Workers AI: las huellas de significado (@cf/baai/bge-m3).
[ai]
binding = "AI"

# El depósito de fotos propias (el mismo `radar-fotos` del sitio): ahí se guardan las ilustraciones, en copias/<huella>.jpg, y el sitio las sirve en /foto/<huella>.jpg.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "radar-fotos"

# La base. El workflow la crea si no existe y reemplaza el marcador.
[[d1_databases]]
binding = "DB"
database_name = "radar-nucleo"
database_id = "REEMPLAZADO_POR_EL_WORKFLOW"

# Los .md (PERFIL, REDACCION) entran al bundle como texto.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[limits]
cpu_ms = 300000

[vars]
GEMINI_MODELO = "gemini-3.1-flash-lite"
NUCLEO_TOPE_DIARIO = "700"
# Desde esta cantidad de pedidos del día, rehacer fotos, foto de archivo e ilustraciones paran: lo que queda es para redactar (Hernán, 6/11).
NUCLEO_TOPE_SECUNDARIO = "400"
# Cuánto de afuera entra (Hernán, 6/11): 4 medios distintos (2 en las áreas chicas), hasta 60 nacionales por día repartidos de 6 a 22. Balcarce y lo contado por 8 medios o más entran siempre.
NUCLEO_MINIMO_NACIONAL = "4"
# Sábados y domingos (de Balcarce) alcanza con 3 medios: esos días se publica menos y se cruzan menos noticias (7/11). Sacarla o igualarla a 4 vuelve atrás.
NUCLEO_MINIMO_NACIONAL_FINDE = "3"
NUCLEO_MINIMO_AREAS_CHICAS = "2"
NUCLEO_TOPE_NACIONAL = "60"
NUCLEO_REDACTAR_POR_VUELTA = "6"
# Rehacer las notas migradas sin foto (REGLAS § 7 ter): cuántas por día (0 lo apaga) y cuántas por vuelta. Sólo foto, sin tocar el texto.
NUCLEO_REHACER_POR_DIA = "30"
NUCLEO_REHACER_POR_VUELTA = "3"
# Ilustraciones con IA para las notas sin foto real (REGLAS § 7, paso 3; Workers AI FLUX.1 schnell, dentro de las neuronas gratis): notas por vuelta e imágenes por día (0 lo apaga).
NUCLEO_ILUSTRAR_POR_VUELTA = "4"
NUCLEO_ILUSTRAR_POR_DIA = "40"
# Foto de archivo (REGLAS § 7, paso 2 bis): antes de ilustrar, notas por vuelta a las que se les busca una foto real propia de otra nota con el mismo lugar o institución (0 lo apaga).
NUCLEO_ARCHIVO_POR_VUELTA = "2"
# Interruptor de publicar (REGLAS § 11): "no" deja las notas en borrador; "si" las publica. Lo cambia una persona el día del corte.
NUCLEO_PUBLICA = "si"

# Respaldo de texto (REGLAS § 5 bis): si Gemini falla o el freno mensual cortó, redactar, verificar y la duda siguen por Mistral (plan gratis).
# Sólo texto: fotos e ilustraciones nunca van a Mistral. Sin el secreto MISTRAL_API_KEY no se llama a nadie y todo queda como antes.
# MISTRAL_MODELO: el modelo (por defecto mistral-large-2512, el del sistema viejo; no hace falta ponerlo).
# MISTRAL_TOPE_DIARIO: pedidos por día a Mistral (por defecto 300; 0 lo apaga). Se cuenta aparte del tope y del freno en dólares de Gemini.
# MISTRAL_TOPE_DIARIO = "300"

# Secretos GEMINI_API_KEY, TELEGRAM_TOKEN y MISTRAL_API_KEY: los carga el workflow desde GitHub Secrets. Nunca acá.

# Enlace directo al bot (para el resumen por Telegram): un Worker no puede llamar a otro de la misma cuenta por workers.dev.
[[services]]
binding = "TELEGRAM"
service = "radar-telegram"
