# El núcleo de Radar 3.0 (ver worker.mjs, nucleo.mjs y REGLAS.md). Lo sube el workflow «Radar 3.0: desplegar» (opción nucleo).
name = "radar-nucleo"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# fotos.mjs usa Buffer para pasar las imágenes a base64.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# Cada 15 minutos la vuelta (leer, agrupar, elegir, redactar); a las 00:30 UTC (21:30 de Balcarce) el resumen del día por Telegram.
crons = ["*/15 * * * *", "30 0 * * *"]

# Workers AI: las huellas de significado (@cf/baai/bge-m3).
[ai]
binding = "AI"

# El depósito de fotos propias (el mismo `radar-fotos` del sitio): ahí se guardan las ilustraciones, en copias/<huella>.jpg, y el sitio las sirve en /foto/<huella>.jpg.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "radar-fotos"

# La base. El workflow la crea si no existe y reemplaza el marcador.
[[d1_databases]]
binding = "DB"
database_name = "radar-nucleo"
database_id = "REEMPLAZADO_POR_EL_WORKFLOW"

# Los .md (PERFIL, REDACCION) entran al bundle como texto.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[limits]
cpu_ms = 300000

[vars]
GEMINI_MODELO = "gemini-3.1-flash-lite"
NUCLEO_TOPE_DIARIO = "500"
# Cuánto de afuera entra (Hernán, 3/11, opción B): 5 medios distintos (3 en las áreas chicas), hasta 40 nacionales por día. Balcarce entra siempre.
NUCLEO_MINIMO_NACIONAL = "4"
NUCLEO_MINIMO_AREAS_CHICAS = "2"
NUCLEO_TOPE_NACIONAL = "60"
NUCLEO_REDACTAR_POR_VUELTA = "6"
# Rehacer las notas migradas sin foto (REGLAS § 7 ter): cuántas por día (0 lo apaga) y cuántas por vuelta. Sólo foto, sin tocar el texto.
NUCLEO_REHACER_POR_DIA = "30"
NUCLEO_REHACER_POR_VUELTA = "3"
# Ilustraciones con IA para las notas sin foto real (REGLAS § 7, paso 3; Workers AI FLUX.1 schnell, dentro de las neuronas gratis): notas por vuelta e imágenes por día (0 lo apaga).
NUCLEO_ILUSTRAR_POR_VUELTA = "2"
NUCLEO_ILUSTRAR_POR_DIA = "40"
# Interruptor de publicar (REGLAS § 11): "no" deja las notas en borrador; "si" las publica. Lo cambia una persona el día del corte.
NUCLEO_PUBLICA = "si"

# Secretos GEMINI_API_KEY y TELEGRAM_TOKEN: los carga el workflow desde GitHub Secrets. Nunca acá.

# Enlace directo al bot (para el resumen por Telegram): un Worker no puede llamar a otro de la misma cuenta por workers.dev.
[[services]]
binding = "TELEGRAM"
service = "radar-telegram"
