  .logo { font-family: var(--f-titulo); font-size: 20px; font-weight: 800; letter-spacing: -.01em; }

  .grande .num.suave { background: var(--fondo); color: var(--suave); }

  .grande .d { font-size: 14.5px; color: var(--suave); margin-top: 2px; }
  .flecha { color: var(--suave); font-size: 24px; }
  .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 0; }
  .dato { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; }
  .dato b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .dato span { font-size: 13px; color: var(--suave); }

  /* Tarjetas, chips, cajas */
  .tarjeta { display: block; width: 100%; text-align: left; background: var(--papel); border: 1px solid var(--linea); border-left: 5px solid var(--franja, var(--linea)); border-radius: var(--radio);

  .motivo { display: block; font-size: 14.5px; color: var(--ambar); background: var(--ambar-fondo); border-radius: 10px; padding: 8px 10px; margin-top: 8px; line-height: 1.35; }
  .motivo.rojo { color: var(--rojo); background: var(--rojo-fondo); }
  .motivo.verde { color: var(--verde); background: var(--verde-fondo); }
  .caja { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 16px; margin: 0 0 12px; font-size: 16px; box-shadow: var(--sombra); }

  details { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 4px 16px; margin: 0 0 12px; }
  summary { cursor: pointer; font-weight: 650; min-height: 48px; display: flex; align-items: center; }

  .ic.ok { background: var(--verde); } .ic.aten { background: #C98A00; } .ic.mal { background: var(--rojo); } .ic.espera { background: var(--suave); }
  .estado-fila b { display: block; }

  /* Pestañas chicas y buscador */
  .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--linea); border-radius: 14px; margin: 10px 0 14px; }
  .sub button { min-height: 48px; border: 0; background: transparent; border-radius: 10px; font-weight: 650; color: var(--suave); cursor: pointer; }
  .sub button[aria-current="true"] { background: var(--papel); color: var(--texto); box-shadow: var(--sombra); }
  input[type=search], input[type=text], textarea, select { width: 100%; min-height: 56px; padding: 12px 14px; border: 1.5px solid var(--linea); border-radius: 14px; background: var(--papel); }
  textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  textarea.cuerpo { min-height: 260px; }
  label { display: block; font-size: 14px; font-weight: 650; margin: 16px 0 6px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; font-size: 16px; }

  .barras { list-style: none; margin: 0; padding: 0; }

  .barras .l { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
  .barras .f { height: 10px; background: var(--linea); border-radius: 5px; margin-top: 4px; overflow: hidden; }
  .barras .f i { display: block; height: 100%; background: var(--verde); border-radius: 5px; }

  .dias i { flex: 1; background: var(--verde); border-radius: 4px 4px 0 0; min-height: 4px; }
  .dias-et { display: flex; gap: 6px; font-size: 11px; color: var(--suave); } .dias-et span { flex: 1; text-align: center; }

  .resultado { text-align: center; padding: 28px 8px 8px; }
  .resultado .ico { display: grid; place-items: center; width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; background: var(--verde-fondo); color: var(--verde); font-size: 46px; font-weight: 700; }
  .vacio { text-align: center; color: var(--suave); padding: 28px 8px; }
  .pildora { display: inline-block; background: var(--rojo); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }

  /* La barra de abajo: cuatro pestañas */
  .pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--papel); border-top: 1px solid var(--linea);
    padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(20,22,26,.08); }
  .pestanas button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 66px; border: 0; background: transparent; font-size: 13px; font-weight: 650; color: var(--suave); cursor: pointer; }
  .pestanas svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pestanas button[aria-current="page"] { color: var(--rojo); box-shadow: inset 0 3px 0 var(--rojo); }
  .pestanas .globo { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--rojo); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }

  /* Confirmaciones (se abren desde abajo) y avisos */
  .velo { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
  .hoja { width: 100%; max-width: 640px; background: var(--papel); border-radius: 22px 22px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  .hoja h3 { font-family: var(--f-titulo); font-size: 22px; margin: 0 0 6px; }
  .hoja .botones { margin-top: 14px; }
  .toast { position: fixed; left: 12px; right: 12px; top: calc(70px + env(safe-area-inset-top)); z-index: 30; max-width: 616px; margin: 0 auto; background: var(--tinta); color: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 16px; }
  .esc { margin-top: 28px; padding-top: 14px; border-top: 1px dashed var(--linea); }
</style>

// ------------------------------------------------------------------ utilidades
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chip = (s) => `<span class="chip" style="background:var(--s-${COLOR[s] ?? 'pais'})">${esc(s)}</span>`;
let RUTA = (location.hash || '#/inicio');
const ir = (h) => { RUTA = h; try { if (location.hash !== h) location.hash = h; } catch { /* sin barra de direcciones */ } ruta(); };
const frase = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
let tt;
function toast(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => { e.hidden = true; }, 3800); }

/** Confirma antes de algo que cuesta deshacer: una hoja desde abajo, con "Cancelar" enfocado. */
function confirmar({ titulo, texto, si = 'Sí', no = 'Cancelar', motivo = null, peligro = false }) {
  return new Promise((listo) => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="hoja" role="dialog" aria-modal="true"><h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      ${motivo ? `<label for="mot">${esc(motivo)}</label><textarea id="mot" rows="3" maxlength="200"></textarea>` : ''}
      <div class="botones"><button class="boton ${peligro ? 'peligro' : 'principal'}" data-r="si">${esc(si)}</button><button class="boton" data-r="no" ${motivo ? '' : 'autofocus'}>${esc(no)}</button></div></div>`;
    document.body.append(velo);
    const cerrar = (r) => { const v = velo.querySelector('#mot')?.value.trim() ?? ''; if (r && motivo && !v) { velo.querySelector('#mot').focus(); toast('Hace falta escribir el motivo.'); return; } velo.remove(); listo({ ok: r, texto: v }); };
    velo.addEventListener('click', (ev) => { const b = ev.target.closest('[data-r]'); if (b) cerrar(b.dataset.r === 'si'); else if (ev.target === velo) cerrar(false); });
    velo.querySelector('[autofocus]')?.focus();
  });
}

/** Con mala conexión una decisión no se pierde: queda en el celular. */
function guardar(texto) {
  if (E.offline) { E.pendientesDeEnviar += 1; pintarAvisos(); toast('Guardado en el celular. Se manda cuando vuelva la señal.'); return false; }
  toast(texto); return true;
}

// ------------------------------------------------------------------ la salud
function salud() {
  const filas = [];
  const aviso = [];
  filas.push({ e: 'ok', t: 'La web', d: 'Se armó hace 12 minutos. La próxima actualización, a las 15:30.' });
  if (E.semaforo === 'verde') {
    filas.push({ e: 'ok', t: 'Redes', d: 'Hoy salieron 5 de 7 piezas. Las otras 2 todavía no es su hora.' });
    filas.push({ e: 'ok', t: 'Inteligencia artificial', d: 'Pedidos de hoy: 75 de 450 (17 %). Voz: 6 de 10 audios.' });
  } else if (E.semaforo === 'amarillo') {
    filas.push({ e: 'aten', t: 'Redes', d: 'No salió el video de “Un día como hoy” de las 09:00.' });
    filas.push({ e: 'aten', t: 'Inteligencia artificial', d: 'Pedidos de hoy: 372 de 450 (83 %). Si se acaban, las notas nuevas quedan sin texto hasta mañana.' });
  } else {
    filas.push({ e: 'mal', t: 'Redes', d: 'No salió la historia de Instagram del repaso de la mañana. El video sí salió.' });
    filas.push({ e: 'ok', t: 'Inteligencia artificial', d: 'Pedidos de hoy: 75 de 450 (17 %). Voz: 6 de 10 audios.' });
  }
  filas.push({ e: 'ok', t: 'Minutos de armado de la web', d: 'Este mes se usaron 2.610 de 6.000 (43 %). Cierra el 10/11.' });
  if (E.semaforo === 'verde') filas.push({ e: 'ok', t: 'Avisos del vigilante', d: 'No hay ninguno abierto.' });
  else filas.push({ e: E.semaforo === 'rojo' ? 'mal' : 'aten', t: 'Avisos del vigilante', d: E.semaforo === 'rojo' ? '7 abiertos, 1 grave (la historia de Instagram). Los otros 6 son de “Un día como hoy”, las piezas fijas de Participá que vencen el 31/10 y el mes de efemérides que falta armar.' : '2 abiertos: las piezas fijas de Participá vencen el 31/10 y falta armar las efemérides del mes que viene.' });
  filas.push({ e: E.semaforo === 'rojo' ? 'aten' : 'ok', t: 'Para mirar', d: E.semaforo === 'rojo' ? '2 avisos graves de la revisión de la IA sobre notas ya publicadas.' : 'La revisión no marcó nada grave.' });
  let color = E.semaforo; let quien = { verde: 'Todo anda', amarillo: 'Hay algo para mirar', rojo: 'Algo no anda' }[color];
  let f = { verde: 'La web y las redes salen con normalidad.', amarillo: 'Hay 2 cosas para mirar, pero nada urgente.', rojo: 'Falló una historia de Instagram.' }[color];
  if (E.pausa) { color = 'gris'; quien = 'En pausa'; f = 'Está todo frenado: no sale nada nuevo.'; filas.unshift({ e: 'espera', t: 'Pausa general', d: 'Prendida desde las 14:10 por Hernán. La web ya publicada sigue en pie.' }); }
  aviso.push(color);
  return { filas, color, quien, f };
}

V.propia = () => `<button class="volver" data-go="#/mas">‹ Más</button><h1>Nota propia</h1><p class="suave">Pegá un dato, un comunicado o un enlace. Primero se mira quién más lo cuenta; después se escribe la nota.</p>
  <label for="dato">El dato</label><textarea id="dato" placeholder="Pegá acá el texto o el enlace"></textarea>
  <div style="height:12px"></div><button class="boton principal" data-act="mirar-dato">Ver quién más lo cuenta</button><div id="dato-res"></div>`;

V.efemerides = () => `<button class="volver" data-go="#/mas">‹ Más</button><h1>Efemérides del mes</h1><p class="suave">“Un día como hoy”, tal como va a salir. Lo que no se aprueba no sale.</p>
  ${efem.map(([d, e, t]) => `<div class="tarjeta" style="cursor:default"><b>${d}</b> <span class="motivo ${e === 'ok' ? 'verde' : ''}" style="display:inline-block;margin:0 0 0 8px">${t}</span>
    ${e === 'espera' ? '' : `<div class="fila-botones" style="margin-top:10px"><button class="boton ${e === 'ok' ? '' : 'principal'}" data-act="efem" data-v="aprobar">Aprobar</button><button class="boton peligro" data-act="efem" data-v="sacar">Sacar</button></div>`}</div>`).join('')}`;

V.revision = () => `<button class="volver" data-go="#/mas">‹ Más</button><h1>Revisión de la IA</h1><p class="suave">Lo que una IA marcó al releer notas ya publicadas. Lo grave llega además por mail.</p>
  <div class="tarjeta" style="--franja:var(--rojo);cursor:default"><span class="chip" style="background:var(--rojo)">Grave</span><div class="titulo">Avanzan los trabajos de refacción en el Hospital Municipal</div><span class="motivo rojo">Afirmación sin sostén: el texto dice que terminan en diciembre y las fuentes no lo dicen.</span><button class="boton" style="margin:10px 0 0" data-go="#/nota/s3">Abrir la nota</button></div>
  <div class="tarjeta" style="--franja:var(--rojo);cursor:default"><span class="chip" style="background:var(--rojo)">Grave</span><div class="titulo">Allanan una vivienda por una causa de amenazas</div><span class="motivo rojo">Tema sensible: puede nombrar a un menor.</span><button class="boton" style="margin:10px 0 0" data-act="retirar-ya">Retirar ahora</button></div>`;

V.ayuda = () => `<button class="volver" data-go="#/mas">‹ Más</button><h1>Ayuda</h1>
  <details open><summary>¿Cuándo se ve en la web lo que decido?</summary><p>Se guarda al instante y sale en la próxima actualización, que es cada media hora. Si no querés esperar, tocá «Actualizar la web ahora» en el inicio (tarda unos 8 minutos).</p></details>
  <details><summary>¿Qué frena la pausa general?</summary><p>La web nueva, las redes y todo lo que gasta IA. No frena a los avisos ni al panel. Lo ya publicado sigue en pie.</p></details>
  <details><summary>¿Y si no tengo señal?</summary><p>El panel abre con lo último que viste. Lo que decidas queda guardado en el celular y se manda cuando vuelva la señal.</p></details>
  <details><summary>Seguridad</summary><p>Lo que espera a una persona llega cifrado: sólo los celulares registrados lo pueden leer. La llave de GitHub queda sólo en este celular; si lo perdés, borrala en GitHub.</p></details>
  <button class="boton" data-act="actualizar-panel">Actualizar el panel (si algo se ve viejo)</button>`;

// ------------------------------------------------------------------ router
function ruta() {
  const [, a = 'inicio', b = ''] = RUTA.split('/');
  const clave = a || 'inicio';
  let html;
  if (clave === 'decidir') html = b ? V.decidirUna(b) : V.decidir();
  else if (clave === 'salio') html = V.salio(b || 'salieron');
  else if (clave === 'nota') html = V.nota(b);
  else if (clave === 'editar') html = V.editar(b);
  else if (clave === 'foto') html = b ? V.fotoUna(b) : V.foto();
  else if (clave === 'listo') { const l = E.listo ? [...E.listo] : null; if (l && E.offline) { l[0] = 'Guardado en el celular'; l[1] = 'Se manda solo cuando vuelva la señal. Mientras tanto no cambia nada en la web.'; } html = l ? V.resultado(...l) : V.inicio(); }
  else html = (V[clave] ?? V.inicio)();
  $('#v').innerHTML = html;
  window.scrollTo(0, 0);
  pestanas(clave);
  const t3 = $('#t3'); if (t3) { const c = () => { const p = t3.value.trim().split(/\s+/).filter(Boolean).length; $('#cuenta').textContent = `${p} palabras`; }; t3.addEventListener('input', c); c(); }
  const arch = $('#arch'); if (arch) arch.addEventListener('change', () => { const f = arch.files[0]; if (f) { const im = $('#prev'); im.src = URL.createObjectURL(f); im.hidden = false; } });
}
const ICONOS = {
  inicio: '<svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>',
  decidir: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>',
  notas: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>',
  mas: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',
};
function pestanas(clave) {
  const grupo = { inicio: 'inicio', salud: 'inicio', salio: 'inicio', listo: 'inicio', decidir: 'decidir', notas: 'notas', nota: 'notas', editar: 'notas', foto: 'inicio' }[clave] ?? 'mas';
  $('#nav').innerHTML = [['inicio', 'Inicio'], ['decidir', 'Decidir'], ['notas', 'Notas'], ['mas', 'Más']].map(([id, t]) => `<button data-go="#/${id}" ${grupo === id ? 'aria-current="page"' : ''}>${ICONOS[id]}${id === 'decidir' && esperan.length ? `<span class="globo">${esperan.length}</span>` : ''}${t}</button>`).join('');
}
function pintarAvisos() {
  const p = $('#aviso-pausa');
  p.hidden = !E.pausa;
  p.innerHTML = '<b>PAUSA GENERAL prendida</b> desde las 14:10 (Hernán). No sale nada nuevo.<br><button data-act="pausa">Reanudar todo</button>';
  $('#aviso-senal').hidden = !E.offline;
  const c = $('#pend'); c.hidden = !E.pendientesDeEnviar; c.textContent = `${E.pendientesDeEnviar} sin mandar`;
}
function tema() { if (E.tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', E.tema); }

// ------------------------------------------------------------------ acciones
document.addEventListener('click', async (ev) => {
  const go = ev.target.closest('[data-go]');
  if (go && !ev.target.closest('[data-act]')) { ir(go.dataset.go); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  ev.preventDefault();
  const id = el.dataset.id; const a = el.dataset.act;
  const sig = () => (esperan.length ? { hash: '#/decidir', texto: `Siguiente nota (quedan ${esperan.length})` } : null);
  if (a === 'publicar') {
    const r = await confirmar({ titulo: '¿Publicarla?', texto: 'La IA la escribe (tarda un minuto) y se controla contra las fuentes. Si el control no encuentra problemas, sale en la próxima actualización (15:30). Si encuentra algo, te la muestra para que decidas.', si: 'Sí, publicarla' });
    if (!r.ok) return;
    esperan = esperan.filter((n) => n.id !== id); guardar('Pedido. La IA la está escribiendo.');
    E.listo = ['Se está escribiendo', 'La IA la escribe y sale en la próxima actualización, hacia las 15:30. Podés seguir con otra.', sig()]; ir('#/listo');
  } else if (a === 'descartar') {
    const r = await confirmar({ titulo: '¿Descartarla?', texto: 'Se saca de la lista. Si te equivocás, la podés volver a traer mientras siga en las noticias del día.', si: 'Sí, descartarla', peligro: true });
    if (!r.ok) return;
    esperan = esperan.filter((n) => n.id !== id); guardar('Descartada.');
    E.listo = ['Descartada', 'Ya no está en la lista.', sig()]; ir('#/listo');
  } else if (a === 'mas-opciones') toast('Acá irían: escribirla a mano, o pedirle a la IA una versión para leer antes de publicar.');
  else if (a === 'retirar') {
    const r = await confirmar({ titulo: '¿Retirar la nota de la web?', texto: 'Deja de verse en la próxima actualización. No se borra: la podés volver a publicar durante 24 horas. Si ya salió en Facebook o Instagram, allá hay que borrarla a mano.', si: 'Sí, retirarla', peligro: true, motivo: '¿Por qué la retirás?' });
    if (!r.ok) return;
    const n = notas.find((x) => x.id === id); E.retiradas.push({ ...n, motivoRetiro: r.texto });
    guardar('Retirada.'); E.listo = ['Retirada', 'Sale de la web en la próxima actualización. La encontrás en Notas → Retiradas hoy, por si te equivocaste.', null]; ir('#/listo');
  } else if (a === 'volver-a-publicar') { E.retiradas = E.retiradas.filter((n) => n.id !== id); guardar('Vuelve a la web en la próxima actualización, con la misma dirección.'); ir('#/notas'); }
  else if (a === 'guardar-edicion') { guardar('Cambios guardados.'); E.listo = ['Cambios guardados', 'Se ven en la web en la próxima actualización. La dirección de la nota no cambia.', null]; ir('#/listo'); }
  else if (a === 'redes') { const r = await confirmar({ titulo: '¿Mandarla a las redes?', texto: 'Sale en el próximo posteo de Facebook que permitan las reglas (hasta 5 por día, 90 minutos entre uno y otro).', si: 'Sí, mandarla' }); if (r.ok) guardar('En la cola de las redes.'); }
  else if (a === 'sumar-foto') {
    if (!$('#arch').files[0]) { toast('Elegí primero la foto.'); return; }
    if (!$('#cred').value.trim()) { toast('Falta decir quién la sacó o de dónde es.'); return; }
    if (!$('#ok').checked) { toast('Tildá la confirmación de la foto.'); return; }
    const r = await confirmar({ titulo: '¿Sumar esta foto?', texto: `Sale en la nota con el crédito “${$('#cred').value.trim()}” en la próxima actualización.`, si: 'Sí, sumarla' });
    if (!r.ok) return;
    sinFoto = sinFoto.filter((n) => n.id !== id); guardar('Foto sumada.');
    E.listo = ['Foto sumada', 'Sale en la nota en la próxima actualización.', sinFoto.length ? { hash: '#/foto', texto: `Otra nota sin foto (quedan ${sinFoto.length})` } : null]; ir('#/listo');
  } else if (a === 'pausa') {
    if (!E.pausa) {
      const r = await confirmar({ titulo: '¿Pausar todo?', texto: 'Se frena la web nueva, las redes y todo lo que usa IA. Lo ya publicado sigue en pie y los avisos siguen andando. Se reanuda con un toque.', si: 'Sí, pausar todo', peligro: true });
      if (!r.ok) return;
      E.pausa = true; toast('Pausa prendida.');
    } else { E.pausa = false; toast('Se reanuda: la próxima actualización sale sola.'); }
    pintarAvisos(); ruta();
  } else if (a === 'actualizar') {
    const r = await confirmar({ titulo: '¿Actualizar la web ahora?', texto: 'Se arma una actualización fuera de hora. Tarda unos 8 minutos en estar en la web. Si ya pediste una hace menos de 3 minutos, hay que esperar.', si: 'Sí, actualizar' });
    if (r.ok) guardar('Pedido. Estará en la web hacia las 14:25.');
  } else if (a === 'estado') { E.semaforo = el.dataset.v; toast(`Semáforo: ${el.dataset.v}.`); }
  else if (a === 'senal') { E.offline = !E.offline; pintarAvisos(); ruta(); }
  else if (a === 'tema') { E.tema = el.dataset.v; tema(); }
  else if (a === 'salir') toast('En el panel de verdad: borra la llave y lo guardado en este celular.');
  else if (a === 'mirar-dato') {
    if (($('#dato').value || '').trim().length < 20) { toast('Pegá al menos una frase.'); return; }
    $('#dato-res').innerHTML = `<div class="caja" style="margin-top:14px"><b>3 medios lo cuentan</b> (el más viejo, hace 2 horas). Nosotros todavía no lo tenemos.</div><button class="boton principal" data-act="hacer-nota">Hacer la nota</button>`;
  } else if (a === 'hacer-nota') { toast('La IA está escribiendo (1 o 2 minutos). Te aviso cuando esté.'); }
  else if (a === 'efem') toast(el.dataset.v === 'aprobar' ? 'Aprobado.' : 'Sacado: ese día no sale.');
  else if (a === 'salir-igual') toast('Pedido anotado: la próxima actualización la escribe.');
  else if (a === 'retirar-ya') { const r = await confirmar({ titulo: '¿Retirar la nota ahora?', texto: 'Deja de verse en la próxima actualización.', si: 'Sí, retirarla', peligro: true, motivo: '¿Por qué?' }); if (r.ok) guardar('Retirada.'); }
  else if (a === 'actualizar-panel') { toast('Panel actualizado.'); }
  else if (a === 'reporte' || a === 'ver-web') toast('Este enlace no está en el prototipo.');
  if (a === 'estado') ruta();
});
document.addEventListener('input', (ev) => { if (ev.target.id !== 'q') return; const p = ev.target.selectionStart; $('#v').innerHTML = V.notas(ev.target.value); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); });
window.addEventListener('hashchange', () => { if (location.hash === RUTA) return; RUTA = location.hash || '#/inicio'; ruta(); });
pintarAvisos(); tema(); ruta();
</script>
</body>
</html>
