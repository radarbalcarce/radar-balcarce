# El Worker del motor (ver worker.mjs y LEEME.md). Sólo existe para que Workers Builds tenga a qué conectarse; la vuelta corre en su compilación.
name = "radar-balcarce-motor"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# El depósito donde la vuelta guarda su memoria, el candado, su último estado y los minutos del mes (estado-r2.mjs). Lo crea el workflow
# «Desplegar Workers de Cloudflare» si no existe. El reloj (infra/reloj-cloudflare/) lo lee con el mismo nombre para saltearse vueltas.
[[r2_buckets]]
binding = "MOTOR"
bucket_name = "radar-motor"

# Secretos (con `wrangler secret put`, nunca acá): VIGILANTE_TOKEN (el mismo de los demás Workers).
# Variable opcional, del panel de Cloudflare (no acá): MOTOR_NOCHE_CADA_HORA="Si" (la misma que en el reloj; regla 312). Sin ella, la proyección del mes
# del GET /estado cuenta 48 vueltas por día aunque el reloj pida 40.
# Variable opcional, del panel de Cloudflare (no acá): MOTOR_CICLO_DIA="11" (la misma que en el reloj; regla 315): el día del mes en que arranca el ciclo de
# facturación de Workers Builds («Oct 11 - Nov 10»). Sin ella, 11. Si la cuenta cambia de ciclo, cambiarla en el reloj, acá y en GitHub (1 a 28).
