name: "Radar 3.0: desplegar"

# Sube los Workers de Radar 3.0 (carpeta v3/) a Cloudflare. SÓLO A MANO. No toca nada del sistema viejo (infra/): son Workers nuevos, con
# otros nombres. Se van sumando acá a medida que existen (plan: docs/propuestas/PLAN-RADAR-3-0.md).
#
#   telegram   v3/redaccion/telegram/   el bot @radarbalcarce_bot (Worker radar-telegram)
#   nucleo     v3/nucleo/               el núcleo: leer, agrupar, elegir, redactar (Worker radar-nucleo, base D1 radar-nucleo, Workers AI)
#   sitio      v3/sitio/                el sitio (Worker radar-sitio, la misma base D1 radar-nucleo; aplica las tablas del núcleo y del sitio)
#   migrar     v3/sitio/scripts/        pasa las notas del sistema viejo a la base (genera los .sql desde web/data/ y los corre; se puede repetir)
#
# Secretos de GitHub que usa (los pega una persona, nunca en un chat): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (los de siempre) y
# TELEGRAM_TOKEN (el de BotFather); el núcleo suma GEMINI_API_KEY_RESPALDO (la clave PAGA de Gemini, que se carga en el Worker como GEMINI_API_KEY).
# Un secreto vacío no se carga: el Worker conserva el que ya tenía.

on:
  workflow_dispatch:
    inputs:
      que:
        description: 'Qué subir'
        type: choice
        options: [telegram, nucleo, sitio, migrar, vigilancia]
        default: telegram

permissions:
  contents: read

concurrency:
  group: v3-desplegar
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUE: ${{ inputs.que }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pruebas del módulo
        run: node --test "v3/**/*.test.mjs"

      # ------------------------------------------------------------------ telegram
      # El bot usa su KV (estado, dueño) y la base D1 del núcleo (las notas propias). Cada marcador se reemplaza en su línea.
      - name: Buscar (o crear) el KV y la base del bot
        if: env.QUE == 'telegram'
        working-directory: v3/redaccion/telegram
        run: |
          TITULO="radar-telegram-ESTADO"
          buscar_kv() {
            npx --yes wrangler@4.139.0 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.title===process.argv[1]);process.stdout.write(x?x.id:'')})" "$TITULO"
          }
          KV=$(buscar_kv)
          if [ -z "$KV" ]; then npx --yes wrangler@4.139.0 kv namespace create "$TITULO"; KV=$(buscar_kv); fi
          test -n "$KV" || { echo "No se pudo encontrar ni crear el KV"; exit 1; }
          NOMBRE="radar-nucleo"
          buscar_db() {
            npx --yes wrangler@4.139.0 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.name===process.argv[1]);process.stdout.write(x?x.uuid:'')})" "$NOMBRE"
          }
          DB=$(buscar_db)
          if [ -z "$DB" ]; then npx --yes wrangler@4.139.0 d1 create "$NOMBRE"; DB=$(buscar_db); fi
          test -n "$DB" || { echo "No se pudo encontrar ni crear la base"; exit 1; }
          sed -e "/^id = /s/REEMPLAZADO_POR_EL_WORKFLOW/$KV/" -e "/^database_id = /s/REEMPLAZADO_POR_EL_WORKFLOW/$DB/" wrangler.toml > wrangler.generado.toml
          ! grep -q REEMPLAZADO_POR_EL_WORKFLOW wrangler.generado.toml || { echo "Quedó un marcador sin reemplazar"; exit 1; }

      # Las tablas del núcleo y las columnas de la redacción propia. Cada ALTER va solo: si la columna ya existe, se sigue.
      - name: Esquema de la base para el bot
        if: env.QUE == 'telegram'
        working-directory: v3/redaccion/telegram
        run: |
          npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file=../../nucleo/db/schema.sql
          grep -E '^(ALTER|CREATE)' schema-redaccion.sql | while IFS= read -r sql; do
            salida=$(npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --command="$sql" 2>&1) || {
              echo "$salida" | grep -qi "duplicate column" && echo "Ya estaba: $sql" || { echo "$salida"; exit 1; }
            }
          done

      - name: Subir el bot
        if: env.QUE == 'telegram'
        working-directory: v3/redaccion/telegram
        run: npx --yes wrangler@4.139.0 deploy --config wrangler.generado.toml --keep-vars

      # El JSON va por un pipe directo a wrangler: el valor no se imprime nunca. Vacío = no se carga y el Worker conserva el que tenía.
      - name: Cargar los secretos del bot
        if: env.QUE == 'telegram'
        working-directory: v3/redaccion/telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_RESPALDO }}
        run: |
          node -e 'const o={};for(const k of ["TELEGRAM_TOKEN","GEMINI_API_KEY"]) if(process.env[k]) o[k]=process.env[k]; process.stdout.write(JSON.stringify(o))' | npx --yes wrangler@4.139.0 secret bulk --config wrangler.generado.toml
      # ------------------------------------------------------------------ nucleo
      - name: Buscar (o crear) la base D1 del núcleo
        if: env.QUE == 'nucleo'
        working-directory: v3/nucleo
        run: |
          NOMBRE="radar-nucleo"
          buscar() {
            npx --yes wrangler@4.139.0 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.name===process.argv[1]);process.stdout.write(x?x.uuid:'')})" "$NOMBRE"
          }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx --yes wrangler@4.139.0 d1 create "$NOMBRE"; ID=$(buscar); fi
          test -n "$ID" || { echo "No se pudo encontrar ni crear la base D1"; exit 1; }
          sed "s/REEMPLAZADO_POR_EL_WORKFLOW/$ID/" wrangler.toml > wrangler.generado.toml

      # Las tablas son CREATE ... IF NOT EXISTS: correrlo de nuevo no rompe ni borra nada.
      - name: Armar las tablas del núcleo
        if: env.QUE == 'nucleo'
        working-directory: v3/nucleo
        run: npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file=db/schema.sql

      - name: Subir el núcleo
        if: env.QUE == 'nucleo'
        working-directory: v3/nucleo
        run: npx --yes wrangler@4.139.0 deploy --config wrangler.generado.toml --keep-vars

      # Los dos secretos van por un pipe directo a wrangler: no se imprimen nunca. Los vacíos no se cargan.
      - name: Cargar las claves del núcleo
        if: env.QUE == 'nucleo'
        working-directory: v3/nucleo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_RESPALDO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || echo "GEMINI_API_KEY_RESPALDO no está en GitHub Secrets: el núcleo lee y agrupa pero no redacta."
          [ -n "$TELEGRAM_TOKEN" ] || echo "TELEGRAM_TOKEN no está en GitHub Secrets: el núcleo no puede avisar por Telegram."
          node -e 'const s={};for(const k of ["GEMINI_API_KEY","TELEGRAM_TOKEN"])if(process.env[k])s[k]=process.env[k];if(!Object.keys(s).length)process.exit(3);process.stdout.write(JSON.stringify(s))' | npx --yes wrangler@4.139.0 secret bulk --config wrangler.generado.toml || echo "Ningún secreto para cargar."

      # ------------------------------------------------------------------ sitio y migrar (comparten la base D1 del núcleo)
      - name: Buscar la base D1 del núcleo (para el sitio)
        if: env.QUE == 'sitio' || env.QUE == 'migrar'
        working-directory: v3/sitio
        run: |
          NOMBRE="radar-nucleo"
          buscar() {
            npx --yes wrangler@4.139.0 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.name===process.argv[1]);process.stdout.write(x?x.uuid:'')})" "$NOMBRE"
          }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx --yes wrangler@4.139.0 d1 create "$NOMBRE"; ID=$(buscar); fi
          test -n "$ID" || { echo "No se pudo encontrar ni crear la base D1"; exit 1; }
          sed "s/REEMPLAZADO_POR_EL_WORKFLOW/$ID/" wrangler.toml > wrangler.generado.toml

      # Primero las tablas del núcleo y después las del sitio. Las dos son CREATE ... IF NOT EXISTS: repetirlo no rompe ni borra nada.
      - name: Armar las tablas (núcleo y sitio)
        if: env.QUE == 'sitio' || env.QUE == 'migrar'
        working-directory: v3/sitio
        run: |
          npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file=../nucleo/db/schema.sql
          npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file=db/schema-sitio.sql

      - name: Subir el sitio
        if: env.QUE == 'sitio'
        working-directory: v3/sitio
        run: npx --yes wrangler@4.139.0 deploy --config wrangler.generado.toml --keep-vars

      # Los .sql son INSERT OR IGNORE en tandas de 100 notas: se puede correr cuantas veces haga falta, no pisa lo que ya está.
      - name: Generar y correr la migración del archivo viejo
        if: env.QUE == 'migrar'
        working-directory: v3/sitio
        run: |
          node scripts/migrar.mjs
          for f in scripts/salida/migracion-*.sql; do
            echo "Corriendo $f"
            npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file="$f"
          done

      # ------------------------------------------------------------------ vigilancia
      # Requiere que radar-nucleo y radar-telegram ya estén subidos (los enlaces de servicio fallan si no existen).
      - name: Buscar (o crear) el KV de la vigilancia
        if: env.QUE == 'vigilancia'
        working-directory: v3/vigilancia
        run: |
          TITULO="radar-vigilancia-ESTADO"
          buscar() {
            npx --yes wrangler@4.139.0 kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.title===process.argv[1]);process.stdout.write(x?x.id:'')})" "$TITULO"
          }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx --yes wrangler@4.139.0 kv namespace create "$TITULO"; ID=$(buscar); fi
          test -n "$ID" || { echo "No se pudo encontrar ni crear el KV"; exit 1; }
          sed "s/REEMPLAZADO_POR_EL_WORKFLOW/$ID/" wrangler.toml > wrangler.generado.toml

      - name: Subir la vigilancia
        if: env.QUE == 'vigilancia'
        working-directory: v3/vigilancia
        run: npx --yes wrangler@4.139.0 deploy --config wrangler.generado.toml --keep-vars

      # El único secreto es TELEGRAM_TOKEN. Va por pipe: no se imprime. Vacío = no se carga.
      - name: Cargar el token en la vigilancia
        if: env.QUE == 'vigilancia'
        working-directory: v3/vigilancia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "TELEGRAM_TOKEN no está en GitHub Secrets"; exit 0; fi
          node -e 'process.stdout.write(JSON.stringify({ TELEGRAM_TOKEN: process.env.TELEGRAM_TOKEN }))' | npx --yes wrangler@4.139.0 secret bulk --config wrangler.generado.toml
