name: Estado del reloj

# A mano. Pregunta a Cloudflare (GraphQL de analítica) cuántas veces corrió el reloj en las últimas 3 horas y con qué resultado, minuto a minuto.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Invocaciones del reloj
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          desde=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ); hasta=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          consulta="{ viewer { accounts(filter:{accountTag:\"$CLOUDFLARE_ACCOUNT_ID\"}) { workersInvocationsAdaptive(limit:300, filter:{scriptName:\"radar-balcarce-reloj\", datetime_geq:\"$desde\", datetime_leq:\"$hasta\"}, orderBy:[datetimeMinute_ASC]) { dimensions { datetimeMinute status } sum { requests errors } } } } }"
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_ANALYTICS_TOKEN" -H "content-type: application/json" --data "$(node -e "console.log(JSON.stringify({query:process.argv[1]}))" "$consulta")" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const l=j.data.viewer.accounts[0].workersInvocationsAdaptive;for(const x of l)console.log(x.dimensions.datetimeMinute.slice(5,16),x.dimensions.status,'pedidos',x.sum.requests,'errores',x.sum.errors)}catch(e){console.log(s.slice(0,600))}})"
