name: Cargar variables del motor

# A mano (PLAN-DE-CAMBIO.md, paso 8). Copia a Workers Builds las variables y los secretos que la vuelta del motor necesita, desde los secretos y las
# variables de GitHub, sin que nadie tenga que volver a pegarlos. Necesita el secreto CF_BUILDS_TOKEN (token de usuario de Cloudflare con
# «Workers Builds Configuration: Edit» y «Workers Scripts: Read»). Nunca imprime un valor.

on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Dejar MOTOR_SIMULAR=Si (ensayo: no guarda ni sube). «No» = el corte, la vuelta real'
        type: choice
        options: ['Si', 'No']
        default: 'Si'

permissions:
  contents: read

jobs:
  cargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cargar en Workers Builds
        run: node infra/motor-cloudflare/cargar-variables.mjs
        env:
          CF_BUILDS_TOKEN: ${{ secrets.CF_BUILDS_TOKEN }}
          SIMULAR: ${{ inputs.simular }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          GEMINI_API_KEY_CLASIFICACION: ${{ secrets.GEMINI_API_KEY_CLASIFICACION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}
          R2_ARCHIVO: ${{ vars.R2_ARCHIVO }}
          SITEMAP_DEL_ARCHIVO: ${{ vars.SITEMAP_DEL_ARCHIVO }}
          TOPE_DE_NOTAS: ${{ vars.TOPE_DE_NOTAS }}
          FOTOS_MENORES_OFICIALES: ${{ vars.FOTOS_MENORES_OFICIALES }}
          POLICIAL_NACIONAL: ${{ vars.POLICIAL_NACIONAL }}
          FUTBOL_SOLO_ARGENTINO: ${{ vars.FUTBOL_SOLO_ARGENTINO }}
          FOTOS_EN_R2: ${{ vars.FOTOS_EN_R2 }}
          ENLACES_CORTOS: ${{ vars.ENLACES_CORTOS }}
          FOTOS_BASE: ${{ vars.FOTOS_BASE }}
          R2_RESPALDOS: ${{ vars.R2_RESPALDOS }}
          R2_FOTOS: ${{ vars.R2_FOTOS }}
          R2_PIEZAS: ${{ vars.R2_PIEZAS }}
          MINIMO_NACIONAL: ${{ vars.MINIMO_NACIONAL }}
          MINIMO_AREAS_CHICAS: ${{ vars.MINIMO_AREAS_CHICAS }}
          BLUESKY_URL: ${{ vars.BLUESKY_URL }}
          TELEGRAM_CANAL_URL: ${{ vars.TELEGRAM_CANAL_URL }}
          WHATSAPP_CANAL_URL: ${{ vars.WHATSAPP_CANAL_URL }}
