# Vigilancia: revisa que todo ande y avisa por WhatsApp si algo falla.
#
# Mira la web publicada, las corridas de los otros workflows, el reloj de redes
# y las piezas fijas del día (redes/vigilar.mjs). Los problemas se avisan una
# vez cada seis horas. Además (redes/avisos.mjs): notas que esperan a una
# persona, una noticia de Balcarce muy importante, lo que salió en redes, las
# estadísticas a las 9 y el resumen del día a las 21 (con las estadísticas).
# Todo en UN solo WhatsApp por corrida.
#
# EL DISPARADOR ES el Worker de Cloudflare `radar-balcarce-reloj` (hasta el 15/10, cron-job.org). Desde el 17/10/2026 corre CADA TRES
# HORAS (a las 0, 3, 6, 9, 12, 15, 18 y 21 de Balcarce) y no cada media hora: lo urgente (la web que no se actualiza, "Actualizar la web"
# que falla) ya lo avisa por mail el vigilante de Cloudflare (infra/vigilante-cloudflare/) cada media hora. Lo que depende de la hora tiene
# su corrida: las estadísticas de las 9 y de las 21 (la de las 21 queda antes del informe de las 21:15) y el cierre del día (la de la
# medianoche cierra el día anterior), con un segundo intento a las 9:30, 21:30 y 0:30 por si el primero no llegó. Las notas que esperan a
# una persona ya se avisaban como mucho una vez cada tres horas (redes/avisos.mjs). Ya no tiene horario propio de GitHub: si el reloj se
# para, se para todo y lo avisa el vigilante de Cloudflare.
#
# A mano (Actions → Vigilancia → Run workflow) se puede elegir "probar-resumen":
# manda UN WhatsApp con el resumen de las 21 tal cual, para ver cómo llega, y
# no guarda nada. Con "probar-cierre" corre el cierre del día de hoy contra Meta
# y muestra el informe y el WhatsApp que saldría, sin mandarlo ni guardar nada.
#
# EL CIERRE DEL DÍA (redes/vigilar.mjs, fechaDelCierre): a partir de las 23:30
# audita el contrato del día contra lo que Meta tiene publicado de verdad
# (redes/auditar-redes.mjs). Avisa por WhatsApp SÓLO si hay discrepancias
# (faltantes, duplicados, o libro y Meta que no coinciden); si todo cuadra, no
# manda nada: la línea "completos" viaja en el próximo mensaje normal.
#
# SECRETOS (Settings → Secrets and variables → Actions):
#   WHATSAPP_TELEFONO   el número con código de país, sin + ni espacios
#   WHATSAPP_APIKEY     la clave que da CallMeBot (ver redes/whatsapp.mjs)
#   CLOUDFLARE_ACCOUNT_ID       el ID de la cuenta de Cloudflare (ya estaba)
#   CLOUDFLARE_ANALYTICS_TOKEN  un token con permiso "Account Analytics: Read"
#                               (si no está, se prueba con CLOUDFLARE_API_TOKEN)
#   META_TOKEN          el mismo que publica: seguidores y estadísticas de redes, y
#                       el cierre del día (sólo lee; nunca se imprime)
#   GEMINI_API_KEY_*, GROQ_API_KEY   las claves de IA: sólo se pregunta si
#                       siguen andando y si están las dos voces propias
#                       (no gasta cupo; nunca se imprimen)
# Sin ellos, corre igual y deja el resultado en el registro; sólo no avisa o no
# mide lo que le falta.

name: Vigilancia

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        type: choice
        options: [vigilar, probar-resumen, probar-cierre]
        default: vigilar

permissions:
  contents: write
  actions: read

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Que "hoy" y las horas (las 9, las 21) sean las de Balcarce.
      TZ: America/Argentina/Buenos_Aires
    steps:
      # Siempre la última versión de main: el cierre del día compara contra el
      # libro, y un libro viejo lo haría avisar de más.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revisar y avisar
        run: node redes/vigilar.mjs ${{ github.event.inputs.modo == 'probar-resumen' && '--probar-resumen' || github.event.inputs.modo == 'probar-cierre' && '--probar-cierre' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          # Las claves de IA, sólo para preguntar si siguen andando (la lista de
          # modelos: no gasta cupo) y si Gemini tiene las dos voces propias (29/09).
          GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          GEMINI_API_KEY_CLASIFICACION: ${{ secrets.GEMINI_API_KEY_CLASIFICACION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Si las redes están apagadas, que el vigilante lo sepa: es esperable que
          # no salga nada y no tiene que avisar pieza por pieza.
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}
          # Con el archivo permanente prendido (16/10/2026), se mira el estado de su última corrida (redes/vigilar.mjs, problemasDelArchivoR2).
          R2_ARCHIVO: ${{ vars.R2_ARCHIVO }}

      - name: Guardar lo avisado y lo medido
        if: always() && github.event.inputs.modo != 'probar-resumen' && github.event.inputs.modo != 'probar-cierre'
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/vigilancia.json web/data/estadisticas.json
          [ -e web/data/estadisticas-piezas.json ] && git add web/data/estadisticas-piezas.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Vigilancia: estado de avisos · $(date '+%d/%m %H:%M')"
            # El mismo ciclo que "Actualizar la web" (actualizar.yml), "Redes" y
            # "Piezas" (28/09): traer lo de las otras corridas, resolver choques
            # de web/data/ con lo de esta corrida (en un rebase, "theirs" es el
            # commit propio) y reintentar hasta tres veces. Con un solo intento,
            # si otra corrida subía justo en el medio, el estado de los avisos se perdía.
            for intento in 1 2 3; do
              if ! git pull --rebase; then
                # Sólo los archivos en conflicto, y sólo si son de web/data/.
                chocan=$(git diff --name-only --diff-filter=U)
                echo "$chocan" | grep -qvE "^web/data/" && { echo "Conflicto fuera de web/data: $chocan"; git rebase --abort; exit 1; }
                echo "$chocan" | xargs -r git checkout --theirs --
                echo "$chocan" | xargs -r git add --
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              git push && break
              sleep 5
            done
            git fetch -q origin main
            [ "$(git rev-list --count origin/main..HEAD)" = 0 ] || { echo "No se pudo guardar el estado de los avisos después de tres intentos"; exit 1; }
          fi
