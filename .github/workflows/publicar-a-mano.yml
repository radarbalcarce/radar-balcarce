name: Publicar a mano

# Publica en Facebook e Instagram lo que pidió una persona (redes/publicar-a-mano.mjs): un reel armado con «Reel a mano» (su video se baja
# de esa corrida) o el posteo con foto de una nota de la web. `esperar` deja pasar unos minutos antes de publicar, para escalonar varias
# publicaciones. Sin «de verdad», sólo muestra lo que publicaría.

on:
  workflow_dispatch:
    inputs:
      reel:
        description: 'El reel (nombre de reels/a-mano/, por ejemplo postre). Vacío si es un posteo'
        type: string
        default: ''
      corrida:
        description: 'El número de la corrida de «Reel a mano» que armó el video (sólo para un reel)'
        type: string
        default: ''
      nota:
        description: 'El id de la nota para el posteo con foto (por ejemplo nrpostre22). Vacío si es un reel'
        type: string
        default: ''
      formato:
        description: 'Cómo: «comun» (reel o posteo con foto), «historia» (el video como historia) o «enlace» (la nota con enlace en Facebook)'
        type: choice
        options: [comun, historia, enlace]
        default: comun
      esperar:
        description: 'Minutos de espera antes de publicar (0 a 300)'
        type: number
        default: 0
      de_verdad:
        description: 'Publicar de verdad (si no, sólo muestra lo que publicaría)'
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - name: Esperar
        run: |
          m=$(( ESPERA > 300 ? 300 : ESPERA ))
          if [ "$m" -gt 0 ]; then echo "Espero $m minutos"; sleep $(( m * 60 )); fi
        env:
          ESPERA: ${{ inputs.esperar }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bajar el video del reel
        if: ${{ inputs.reel != '' }}
        uses: actions/download-artifact@v4
        with:
          name: reels-a-mano
          path: reels/salida
          run-id: ${{ inputs.corrida }}
          github-token: ${{ github.token }}
      - name: Publicar
        run: |
          args=()
          [ -n "$REEL" ] && args+=("--reel=$REEL")
          [ -n "$NOTA" ] && args+=("--nota=$NOTA")
          [ "$FORMATO" = "historia" ] && args+=("--historia")
          [ "$FORMATO" = "enlace" ] && args+=("--enlace")
          [ "$DE_VERDAD_SI" = "true" ] && args+=("--de-verdad")
          node redes/publicar-a-mano.mjs "${args[@]}"
        env:
          REEL: ${{ inputs.reel }}
          NOTA: ${{ inputs.nota }}
          DE_VERDAD_SI: ${{ inputs.de_verdad }}
          FORMATO: ${{ inputs.formato }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SITIO: https://radarbalcarce.com
