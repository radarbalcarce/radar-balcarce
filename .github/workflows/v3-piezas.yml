name: "Radar 3.0: piezas de redes"

# Arma las piezas de video del día de Radar 3.0 (clima, clima auspiciado, repasos, farmacia, efeméride, Participá) con la voz de siempre y, si las redes de 3.0 están prendidas,
# las publica en Instagram y Facebook (reel e historia). Dibujar (resvg) y juntar (ffmpeg) no entra en un Worker: por eso corre acá. Quién decide QUÉ toca es el Worker
# `radar-redes` (POST /piezas/plan: horarios, notas de la base, comercio del clima, cupo de voz); este workflow sólo ejecuta y le cuenta cómo salió. Reglas: v3/redes/REGLAS.md.
#
# ENSAYO por defecto: con la variable REDES_ACTIVAS del Worker radar-redes en «no» arma todo, guarda los videos como adjunto de la corrida y en la base (tabla `piezas`, con lo que
# HABRÍA publicado y cuándo) y NO llama a Meta. El interruptor es el mismo que el de los posteos (wrangler.toml de v3/redes): prenderlo es subir «redes» con REDES_ACTIVAS = «si».
#
# Corre una vez por hora de 7:07 a 23:07 de Balcarce (las ventanas de las piezas son de una hora o más, así que no hace falta más; menos corridas = menos minutos si el repositorio pasa a privado).
# A mano: Actions → «Radar 3.0: piezas de redes» → Run workflow. `solo` ensaya esas piezas (por ejemplo clima-manana,noticia1) aunque no toquen ahora; `ahora` ensaya a otra hora
# (ISO, por ejemplo 2026-11-03T13:00:00Z). Las dos sólo valen con las redes apagadas.
#
# Secretos de GitHub (los pega una persona, nunca en un chat): TELEGRAM_TOKEN (de ahí sale la contraseña con el Worker), GEMINI_API_KEY_REDES (la voz), META_TOKEN (sólo para publicar de
# verdad) y, opcional, GEMINI_API_KEY_REDES_V3: una clave de voz aparte para el ensayo, para no gastar el cupo de la clave que usa el sistema viejo.
# Para TikTok, YouTube Shorts y X (por Buffer, como hacía el sistema viejo): BUFFER_API_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY y CLOUDFLARE_ACCOUNT_ID (ya están en GitHub; el video se sube
# a R2 y Buffer lo lee por la ruta /video del Worker radar-balcarce-tareas, que tiene que seguir en pie). Para Bluesky y Threads (segundo paso, «enlaces»): BLUESKY_APP_PASSWORD,
# THREADS_TOKEN y THREADS_USER_ID; sin ellos esas redes no publican. Reglas: v3/redes/REGLAS.md § 12.
# Variables de GitHub (opcionales): V3_AUDIOS_POR_DIA, V3_REDES_URL, BLUESKY_HANDLE (por defecto radarbalcarce.bsky.social), R2_RENDER (el bucket de los videos; el mismo del sistema viejo).
# (las dos primeras:) V3_AUDIOS_POR_DIA (cupo de audios del día en esta corrida; por defecto 10), V3_REDES_URL (la dirección del Worker).

on:
  # Desde el 10/11/2026 lo dispara el Worker radar-redes (v3/redes, disparar-acciones) a la misma hora; GitHub dejó de lanzar los horarios ese día.
  # (La hora de antes, en UTC: '7 10-23,0-2 * * *'.) Nada de este workflow distingue horario de a mano: con `solo`, `ahora` y `repetir` vacíos corre igual, y publica de verdad si
  # las redes están prendidas. `automatico` sólo lo manda el Worker (queda en el nombre de la corrida); a mano se deja como está.
  workflow_dispatch:
    inputs:
      automatico:
        description: 'Lo manda solo el Worker radar-redes (el reloj). A mano, dejar como está'
        type: string
        default: 'false'
      solo:
        description: 'Ensayar sólo estas piezas, separadas por coma (clima-manana, clima-noche, farmacia, utiles, agenda, feriado, aviso-helada, aviso-granizo, aviso-viento, efemeride, participa-noticias, participa-evento, participa-reclamos, participa-nota, noticia1, noticia2, podcast). Vacío = lo que toca ahora'
        type: string
        default: ''
      repetir:
        description: 'VOLVER A PUBLICAR una nota (su id, por ejemplo ls3twi6) en Facebook e Instagram con la placa nueva, sin borrar el posteo anterior. Dibuja la placa si falta. Vacío = nada. Sólo corre este paso'
        type: string
        default: ''
      ahora:
        description: 'Ensayar a otra hora (ISO UTC, por ejemplo 2026-11-03T13:00:00Z). Vacío = ahora'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: v3-piezas
  cancel-in-progress: false

jobs:
  piezas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar
        run: npm ci --no-audit --no-fund

      # La memoria de voces: un mismo texto con la misma voz se pide UNA vez al día; si la pieza se rearma (falló ffmpeg, Meta contestó con error) se reusa el audio y no se gasta cupo.
      - name: Restaurar la memoria de voces
        uses: actions/cache/restore@v4
        with:
          path: .cache/voz-v3
          key: voz-v3-${{ github.run_id }}
          restore-keys: |
            voz-v3-

      # Las placas de los posteos de notas (foto arriba, rótulo de la sección, título y bajada): se dibujan acá (resvg) y se suben a R2; el Worker las publica y Meta las baja de su dirección.
      # Con `repetir` además vuelve a publicar esa nota (POST /posteos/repetir) y los demás pasos no corren.
      - name: Dibujar las placas de los posteos
        continue-on-error: ${{ inputs.repetir == '' }}
        run: node v3/redes/piezas/posteos.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RENDER: ${{ vars.R2_RENDER }}
          REDES_URL: ${{ vars.V3_REDES_URL }}
          REPETIR: ${{ inputs.repetir }}

      - name: Armar las piezas que tocan
        if: inputs.repetir == ''
        run: node v3/redes/piezas/correr.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TARJETAS_DE_SERVICIO: 'no' # 13/11: la tarjeta colgaba el programa y el clima salió 3 veces; apagada hasta arreglarla
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          GEMINI_API_KEY_REDES_V3: ${{ secrets.GEMINI_API_KEY_REDES_V3 }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RENDER: ${{ vars.R2_RENDER }}
          REDES_URL: ${{ vars.V3_REDES_URL }}
          AUDIOS_POR_DIA: ${{ vars.V3_AUDIOS_POR_DIA }}
          VOZ_CACHE: ${{ github.workspace }}/.cache/voz-v3
          SALIDA_PIEZAS: ${{ github.workspace }}/salida-piezas
          SOLO: ${{ inputs.solo }}
          AHORA: ${{ inputs.ahora }}

      # Bluesky y Threads: las notas que ya salieron en Facebook, como enlace (título + enlace + imagen 1,91:1). Sigue aunque las piezas hayan fallado; sin secretos no publica.
      - name: Publicar los enlaces (Bluesky, Threads y X)
        if: always() && inputs.repetir == ''
        continue-on-error: true
        run: node v3/redes/piezas/enlaces.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_IMAGENES: ${{ vars.BUFFER_IMAGENES }}
          REDES_URL: ${{ vars.V3_REDES_URL }}
          SALIDA_PIEZAS: ${{ github.workspace }}/salida-piezas
          AHORA: ${{ inputs.ahora }}

      - name: Guardar la memoria de voces
        if: always() && hashFiles('.cache/voz-v3/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/voz-v3
          key: voz-v3-${{ hashFiles('.cache/voz-v3/*.json') }}

      # El resultado del ensayo: los videos con voz y el registro de lo que habría publicado. El de verdad (publicado) queda también en Meta.
      - name: Dejar las piezas para ver
        if: always() && hashFiles('salida-piezas/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: piezas-v3
          path: |
            salida-piezas/*.mp4
            salida-piezas/*.json
          if-no-files-found: ignore
          retention-days: 7
