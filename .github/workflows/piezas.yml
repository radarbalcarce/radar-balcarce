# Arma las piezas del día (voces, reels, historias, podcast) en los servidores
# de GitHub, con la PC apagada, y opcionalmente las publica en Instagram.
#
# Todo lo que sale a Instagram es video con voz: es lo único que se puede
# entregar directo, sin dejarlo en un sitio público.
#
# La voz sale de Gemini con el secreto GEMINI_API_KEY_REDES (la clave de redes,
# separada de la que redacta las notas). Si Gemini falla, la pieza no sale (nunca
# con otra voz) y el reloj la vuelve a pedir en la vuelta siguiente.
#
# Publicar necesita el secreto META_TOKEN y que la variable REDES_ACTIVAS valga
# "si". Sin esa variable sólo simula.
#
# A mano: pestaña Actions → "Piezas" → Run workflow.
#   solo      una o varias piezas (por ejemplo clima-manana). Hay que elegir:
#             vacío no arma nada (28/09: vacío armaba TODAS las del día y
#             gastaba un audio del cupo de voz por cada una)
#   todas     armar todas las piezas del día a propósito (gasta un audio del
#             cupo de voz, 10 por día, por pieza); sólo cuenta si "solo" está vacío
#   publicar  además de armarlas, subirlas ya, sin esperar su hora
#   destino   ambas (Instagram y la página de Facebook), instagram o facebook

name: Piezas

on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'Qué piezas, separadas por coma (por ejemplo clima-manana). Vacío no arma nada'
        type: string
        default: ''
      todas:
        description: 'Armar TODAS las piezas del día (un audio del cupo de voz, 10 por día, por cada una). Sólo si "solo" está vacío'
        type: boolean
        default: false
      publicar:
        description: 'Publicarlas ahora, sin esperar su hora'
        type: boolean
        default: false
      destino:
        description: 'Dónde publicarlas'
        type: choice
        options: [ambas, instagram, facebook]
        default: ambas

concurrency:
  group: redes # la misma que el reloj: nunca dos publicando a la vez
  cancel-in-progress: false

jobs:
  piezas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # para guardar el libro de lo ya publicado
    env:
      # Que "hoy" y "las 19:00" sean los de Balcarce y no los de UTC.
      TZ: America/Argentina/Buenos_Aires

    steps:
      # Siempre la última versión de main, no la que había cuando se DISPARÓ la
      # corrida: si una corrida espera a la anterior (el candado "redes"), sin
      # esto trabaja con el libro viejo y publica de nuevo lo que la anterior ya
      # había publicado. Pasó el 25/09: el repaso de la mañana salió dos veces.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Antes de instalar nada: sin piezas elegidas no se arma nada (28/09).
      # Con "solo" vacío se armaban todas las del día, cada una con un audio
      # del cupo de voz de Gemini. Para eso ahora hay que marcar "todas".
      - name: Ver qué piezas se piden
        run: |
          if [ -z "$SOLO" ] && [ "$TODAS" != "true" ]; then
            echo "::error title=Sin piezas elegidas::No se armó nada. Escribí en \"solo\" qué piezas querés (por ejemplo clima-manana) o marcá \"todas\" para armar todas las del día (un audio del cupo de voz, 10 por día, por cada una)."
            exit 1
          fi
        env:
          SOLO: ${{ inputs.solo }}
          TODAS: ${{ inputs.todas }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Acá sí se instala: las placas necesitan resvg y los videos, ffmpeg.
      - name: Instalar
        run: npm ci --no-audit --no-fund

      # Lo que se escribe en "solo" llega por una variable y no pegado en el
      # comando: pegado, un texto con comillas o un ";" se ejecutaba como
      # parte del comando (auditoría del 25/09).
      # La memoria de voces (C-16, 8/10/2026): un texto con la misma voz y el mismo estilo se pide UNA vez al día; si la pieza se arma de
      # nuevo (falló ffmpeg, Meta contestó con error, el reloj la volvió a pedir) se reusa el audio y no se gasta cupo (reels/voz-gemini.mjs).
      - name: Restaurar la memoria de voces
        uses: actions/cache/restore@v4
        with:
          path: .cache/voz
          key: voz-${{ github.run_id }}
          restore-keys: |
            voz-

      - name: Armar las piezas
        run: |
          if [ -n "$SOLO" ]; then
            node reels/plan.mjs --generar "--solo=$SOLO"
          elif [ "$TODAS" = "true" ]; then
            node reels/plan.mjs --generar
          else
            echo "Sin piezas elegidas: no se arma nada."; exit 1
          fi
        env:
          SOLO: ${{ inputs.solo }}
          TODAS: ${{ inputs.todas }}
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          VOZ_CACHE: ${{ github.workspace }}/.cache/voz
          # FOTOS_EN_R2 ("Si", regla 316): reels/plan.mjs trae del sitio las fotos del repaso antes de armar el plan. Vacía, no hace nada.
          FOTOS_EN_R2: ${{ vars.FOTOS_EN_R2 }}
          SITIO: https://radarbalcarce.com

      - name: Guardar la memoria de voces
        if: always() && hashFiles('.cache/voz/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/voz
          key: voz-${{ hashFiles('.cache/voz/*.json') }}

      - name: Dejar las piezas para descargar
        uses: actions/upload-artifact@v4
        with:
          name: piezas
          path: |
            reels/salida/*.mp4
            reels/salida/*.mp3
            reels/salida/*.png
            reels/salida/piezas.json
          if-no-files-found: error
          retention-days: 7

      - name: Publicar en Instagram y Facebook
        if: ${{ inputs.publicar }}
        run: node redes/publicar.mjs --piezas --sin-horario "--destino=$DESTINO"
        env:
          DESTINO: ${{ inputs.destino }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}
          # Interruptores apagados por defecto (regla 311): ver redes.yml.
          ENLACES_CORTOS: ${{ vars.ENLACES_CORTOS }}
          FOTOS_EN_R2: ${{ vars.FOTOS_EN_R2 }}

      # El libro dice qué pieza ya salió. Sin guardarlo, la próxima vuelta
      # publicaría lo mismo otra vez. Se guarda aunque el paso anterior haya
      # fallado a la mitad: lo que sí salió no tiene que repetirse.
      - name: Guardar lo publicado
        if: ${{ always() && inputs.publicar }}
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/redes.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Redes: libro de publicaciones · $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            # El mismo ciclo que "Redes" y "Actualizar la web": traer lo de las
            # otras corridas, resolver choques de web/data/ con lo de esta
            # corrida y reintentar hasta tres veces. Si el libro no se guarda,
            # el reloj vuelve a publicar lo mismo en la vuelta siguiente.
            for intento in 1 2 3; do
              if ! git pull --rebase; then
                chocan=$(git diff --name-only --diff-filter=U)
                echo "$chocan" | grep -qvE "^web/data/" && { echo "Conflicto fuera de web/data: $chocan"; git rebase --abort; exit 1; }
                echo "$chocan" | xargs -r git checkout --theirs --
                echo "$chocan" | xargs -r git add --
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              git push && break
              sleep 5
            done
            git fetch -q origin main
            [ "$(git rev-list --count origin/main..HEAD)" = 0 ] || { echo "No se pudo guardar el libro después de tres intentos: la vuelta siguiente puede repetir lo publicado"; exit 1; }
          fi

      # El ARCHIVO DE PIEZAS (15/10/2026, docs/redes/ARCHIVO-DE-PIEZAS.md): copia a un depósito propio de Cloudflare R2 (variable R2_PIEZAS) lo que
      # esta corrida armó (videos, audios con la voz, subtítulos, placas), porque el artefacto de arriba se borra en unos días y Meta no guarda
      # los archivos propios. VA AL FINAL, DESPUÉS DE PUBLICAR Y DE GUARDAR EL LIBRO, y con continue-on-error: nunca frena ni atrasa la
      # publicación. Sin R2_PIEZAS o sin credenciales dice "sin archivo de piezas" y sigue. No sube lo que espera a una persona ni lo retirado.
      - name: Archivar las piezas en R2 (nunca frena nada)
        if: always() && hashFiles('reels/salida/piezas.json') != ''
        continue-on-error: true
        timeout-minutes: 6
        run: node redes/archivar-piezas.mjs --subir
        env:
          R2_PIEZAS: ${{ vars.R2_PIEZAS }}
          R2_RESPALDOS: ${{ vars.R2_RESPALDOS }}
          R2_FOTOS: ${{ vars.R2_FOTOS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
