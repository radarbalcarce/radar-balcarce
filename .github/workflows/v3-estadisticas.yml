# Radar 3.0: las estadísticas de la web (Cloudflare Web Analytics) y de Facebook e Instagram (API de Meta), a pedido.
# Corre redes/estadisticas.mjs, que mide y muestra los números en el registro (no guarda nada ni publica nada).
# Desde el 3/11/2026 el vigilante viejo dejó de medirlas: esto las trae de vuelta hasta que estén en el informe diario de 3.0 (Hernán, 7/11).
name: "Radar 3.0: estadísticas"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/Argentina/Buenos_Aires
      META_TOKEN: ${{ secrets.META_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Medir
        run: node redes/estadisticas.mjs
