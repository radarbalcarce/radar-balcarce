name: Probar ilustraciones

# A mano. Rehace con las instrucciones de hoy las ilustraciones de las notas de las últimas horas y deja ANTES y DESPUÉS como adjunto, con el prompt y el control.
# No publica nada ni toca el repositorio. Gasta unas pocas llamadas a Gemini (o Groq, de respaldo) y ~80 neuronas por imagen del cupo gratis diario.
# Ver scripts/medir/probar-ilustraciones.mjs.

on:
  workflow_dispatch:
    inputs:
      horas:
        description: 'De cuántas horas para atrás'
        default: '24'
      cuantas:
        description: 'Cuántas notas rehacer como máximo'
        default: '12'

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rehacer y comparar
        env:
          TOKEN: ${{ secrets.VIGILANTE_TOKEN }}
          GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
          GEMINI_API_KEY_CLASIFICACION: ${{ secrets.GEMINI_API_KEY_CLASIFICACION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HORAS: ${{ inputs.horas }}
          CUANTAS: ${{ inputs.cuantas }}
        run: node scripts/medir/probar-ilustraciones.mjs salida "$HORAS" "$CUANTAS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ilustraciones-de-prueba
          path: salida/
