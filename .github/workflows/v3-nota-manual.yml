# Carga en Radar 3.0 una nota ya escrita y aprobada por una persona, desde un archivo de v3/nucleo/notas-manuales/ (para cuando no se la puede dictar por el bot). SÓLO A MANO.
# Hace el mismo INSERT que el bot al publicar una nota propia, con redes «sólo la web». Si el id ya existe, falla y no pisa nada.
name: 'Radar 3.0: cargar una nota a mano'

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'El id de la nota (el nombre del archivo, sin .json, en v3/nucleo/notas-manuales/)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: v3-nota-manual
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTA_ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cargar la nota
        run: |
          case "$NOTA_ID" in *[!a-z0-9]*|"") echo "id inválido"; exit 1;; esac
          test -f "v3/nucleo/notas-manuales/$NOTA_ID.json" || { echo "No existe el archivo"; exit 1; }
          node v3/nucleo/notas-manuales/cargar.mjs "v3/nucleo/notas-manuales/$NOTA_ID.json" > nota.sql
          DB=$(npx --yes wrangler@4.139.0 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const x=l.find(n=>n.name==='radar-nucleo');process.stdout.write(x?x.uuid:'')})")
          test -n "$DB" || { echo "No encuentro la base radar-nucleo"; exit 1; }
          printf 'name = "nota-manual"\ncompatibility_date = "2026-10-01"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "radar-nucleo"\ndatabase_id = "%s"\n' "$DB" > wrangler.generado.toml
          npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --file=nota.sql
          npx --yes wrangler@4.139.0 d1 execute radar-nucleo --remote --config wrangler.generado.toml --command="SELECT id, titulo, seccion, estado, slug FROM notas WHERE id = '$NOTA_ID';"
